<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Camila y Lizy</title>
<meta name="theme-color" content="#2b2340">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#2b2340;overflow:hidden;font-family:"Trebuchet MS",system-ui,sans-serif;color:#fff;touch-action:manipulation}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas#game{image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#f6d9a0}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(27,20,44,.62);text-align:center;padding:16px}
.ov[hidden]{display:none}
h1{margin:0;font-size:clamp(26px,6vw,46px);letter-spacing:1px;text-shadow:0 3px 0 #000;color:#ffe08a}
h2{margin:0;font-size:clamp(20px,4.5vw,32px);text-shadow:0 2px 0 #000}
p{margin:0;max-width:520px;font-size:clamp(13px,2.8vw,16px);line-height:1.35;text-shadow:0 1px 0 #000}
.pick{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.dog{background:#fff7e6;color:#2b2340;border:4px solid #2b2340;border-radius:12px;padding:10px 12px 12px;width:min(42vw,200px);cursor:pointer;box-shadow:0 5px 0 #000;font:inherit}
.dog:active{transform:translateY(3px);box-shadow:0 2px 0 #000}
.dog canvas{width:100%;height:auto;image-rendering:pixelated;background:#f6d9a0;border-radius:6px}
.dog b{display:block;font-size:20px;margin-top:6px}
.dog span{display:block;font-size:12px;line-height:1.25;margin-top:3px;color:#5a4c6b}
.btn{font:inherit;font-weight:700;font-size:18px;border:4px solid #2b2340;border-radius:12px;background:#ffcf4a;color:#2b2340;padding:10px 22px;box-shadow:0 5px 0 #000;cursor:pointer}
.btn.sec{background:#fff7e6}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #000}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ctrl{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));width:96px;height:72px;border-radius:16px;border:3px solid rgba(255,255,255,.7);background:rgba(43,35,64,.35);color:#fff;font:700 15px inherit;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 0 #000}
#bDuck{left:12px} #bJump{right:12px}
.ctrl[hidden]{display:none}
.top{position:absolute;top:max(8px,env(safe-area-inset-top));right:10px;display:flex;gap:8px}
.ic{width:40px;height:40px;border-radius:10px;border:3px solid rgba(255,255,255,.8);background:rgba(43,35,64,.45);color:#fff;font-size:18px;line-height:1;cursor:pointer}
.big{font-size:clamp(34px,9vw,60px);color:#ffe08a;text-shadow:0 3px 0 #000;font-weight:800}
.small{font-size:12px;opacity:.85}
#rot{display:none}
@media (orientation:portrait) and (max-width:700px){#rot{display:block}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div class="ov" id="menu">
    <h1>Camila y Lizy</h1>
    <p>Corre por el patio, salta los limoneros y los árboles de mango, agáchate cuando pase el cuculí y junta todos los huesos y marraquetas que puedas.</p>
    <div class="pick">
      <button class="dog" data-dog="camila"><canvas width="64" height="40" id="thC"></canvas><b>Camila</b><span>Chiquita y sabia. Es tan bajita que los cuculíes le pasan por encima.</span></button>
      <button class="dog" data-dog="lizy"><canvas width="64" height="40" id="thL"></canvas><b>Lizy</b><span>Grande y saltarina. Salta más alto que nadie.</span></button>
    </div>
    <p class="small" id="recTxt"></p>
    <p class="small" id="rot">Gira el celular para jugar más cómodo.</p>
  </div>

  <div class="ov" id="over" hidden>
    <h2 id="ovTitle">¡Ay!</h2>
    <div class="big" id="ovScore">0</div>
    <p id="ovInfo"></p>
    <div class="row"><button class="btn" id="again">Otra vez</button><button class="btn sec" id="change">Cambiar perrita</button></div>
  </div>

  <div class="ov" id="pause" hidden>
    <h2>Pausa</h2>
    <div class="row"><button class="btn" id="resume">Seguir</button><button class="btn sec" id="quit">Salir</button></div>
  </div>

  <div class="top"><button class="ic" id="bMute" aria-label="Sonido">♪</button><button class="ic" id="bPause" aria-label="Pausa" hidden>❚❚</button></div>
  <button class="ctrl" id="bDuck" hidden>Agacharse</button>
  <button class="ctrl" id="bJump" hidden>Saltar</button>
</div>

<script>
"use strict";
// ---------- Configuración ----------
const H = 156;                 // alto lógico (pixeles del juego)
let W = 320;                   // ancho lógico, se ajusta a la pantalla
const GROUND = 128;            // línea del suelo
const G = 950;                 // gravedad
const DOGS = {
  camila:{name:"Camila", w:20, h:15, dh:11, jump:300, draw:drawCamila},
  lizy:  {name:"Lizy",   w:30, h:25, dh:15, jump:345, draw:drawLizy}
};
const REC_KEY = "camila-lizy-records";
let records = {}; try{ records = JSON.parse(localStorage.getItem(REC_KEY))||{}; }catch(e){}
const saveRec = ()=>{ try{ localStorage.setItem(REC_KEY, JSON.stringify(records)); }catch(e){} };

const cv = document.getElementById("game"), ctx = cv.getContext("2d");
const low = document.createElement("canvas"), lc = low.getContext("2d");
function resize(){
  const vw = innerWidth, vh = innerHeight;
  W = Math.round(Math.min(380, Math.max(220, H * vw / vh)));
  low.width = W; low.height = H;
  const scale = Math.max(1, Math.min(vw / W, vh / H));
  cv.width = W; cv.height = H;
  cv.style.width = Math.floor(W * scale) + "px";
  cv.style.height = Math.floor(H * scale) + "px";
}
addEventListener("resize", resize); resize();

// ---------- Sonido (tonos simples) ----------
let AC = null, muted = false;
try{ muted = localStorage.getItem("cl-mute")==="1"; }catch(e){}
function beep(f1, f2, dur, type="square", vol=.07){
  if(muted) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t+dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur);
  }catch(e){}
}
const sJump = ()=>beep(380, 760, .14);
// Ladrido sintetizado: "GUAU" con ataque fuerte, voz áspera y resonancias de hocico.
// Lizy: ladrido grande, grave y más largo. Camila: ladrido chico y agudo.
function grit(){ const shaper = AC.createWaveShaper(); const n=1024, cu=new Float32Array(n); for(let i=0;i<n;i++){ const x=i/(n-1)*2-1; cu[i]=Math.tanh(x*3.2); } shaper.curve=cu; return shaper; }
function bark(dogK, small){
  if(muted) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const t = AC.currentTime + .005, big = dogK==="lizy", k = small ? 1.18 : 1;
    const dur = (big ? .34 : .2) * (small ? .7 : 1);
    const fStart = (big ? 190 : 430)*k, fPeak = (big ? 290 : 620)*k, fEnd = (big ? 120 : 300)*k;
    const out = AC.createGain();
    out.gain.setValueAtTime(0.0001, t); out.gain.exponentialRampToValueAtTime(big ? .55 : .45, t+.012);
    out.gain.setValueAtTime(big ? .5 : .4, t+dur*.35); out.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    // voz: dos osciladores levemente desafinados + distorsión suave
    const pre = AC.createGain(); pre.gain.value = .6;
    [["sawtooth",1],["square",.995]].forEach(([ty,det])=>{
      const o = AC.createOscillator(); o.type = ty;
      o.frequency.setValueAtTime(fStart*det, t); o.frequency.exponentialRampToValueAtTime(fPeak*det, t+dur*.18); o.frequency.exponentialRampToValueAtTime(fEnd*det, t+dur);
      o.connect(pre); o.start(t); o.stop(t+dur+.02);
    });
    // aire/ruido al comienzo (el "g" del guau)
    const nb = AC.createBuffer(1, Math.floor(AC.sampleRate*dur), AC.sampleRate), d = nb.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * Math.exp(-i/(AC.sampleRate*.05));
    const ns = AC.createBufferSource(); ns.buffer = nb; const ng = AC.createGain(); ng.gain.value = big ? .5 : .35; ns.connect(ng); ng.connect(pre); ns.start(t);
    const sh = grit(); pre.connect(sh);
    // resonancias del hocico (formantes): "a" abierta que se cierra en "u"
    const f1 = AC.createBiquadFilter(), f2 = AC.createBiquadFilter(), lp = AC.createBiquadFilter();
    f1.type = f2.type = "bandpass"; f1.Q.value = 4; f2.Q.value = 5;
    f1.frequency.setValueAtTime((big?700:1100)*k, t); f1.frequency.linearRampToValueAtTime((big?450:800)*k, t+dur);
    f2.frequency.setValueAtTime((big?1500:2300)*k, t); f2.frequency.linearRampToValueAtTime((big?1000:1700)*k, t+dur);
    lp.type = "lowpass"; lp.frequency.value = big ? 2600 : 4000;
    const g1 = AC.createGain(), g2 = AC.createGain(), dry = AC.createGain(); g1.gain.value = 1.4; g2.gain.value = .8; dry.gain.value = .25;
    sh.connect(f1); sh.connect(f2); sh.connect(dry); f1.connect(g1); f2.connect(g2);
    g1.connect(lp); g2.connect(lp); dry.connect(lp); lp.connect(out); out.connect(AC.destination);
  }catch(e){}
}

// ---------- Música de fondo estilo consola portátil (melodía original) ----------
const NOTE = n=>{ if(!n||n==="-"||n===".") return 0; const m=n.match(/^([A-G])(#?)(\d)$/); const st={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]?1:0); return 440*Math.pow(2,(st+12*(+m[3]+1)-69)/12); };
// 16 compases de 8 corcheas. "-" = sostiene la nota anterior, "." = silencio
const MEL = [
 "C5 E5 G5 E5 A5 G5 E5 C5", "D5 F5 A5 F5 G5 - E5 -", "C5 E5 G5 C6 B5 G5 A5 G5", "F5 E5 D5 E5 C5 - - .",
 "E5 G5 C6 G5 A5 F5 D5 F5", "G5 E5 C5 E5 D5 - G4 -", "F5 A5 C6 A5 G5 E5 C5 E5", "D5 F5 E5 D5 C5 - . .",
 "A4 C5 E5 C5 F5 E5 C5 A4", "G4 B4 D5 B4 C5 - E5 -", "F5 - E5 - D5 - C5 -", "D5 E5 F5 G5 A5 - G5 .",
 "C6 - B5 A5 G5 - E5 -", "F5 - E5 D5 E5 - C5 -", "D5 C5 B4 C5 D5 E5 F5 G5", "C6 - G5 E5 C5 - . ."
].map(b=>b.split(" "));
const BASS = ["C3","D3","C3","F3","C3","G2","F3","G2","A2","G2","F2","G2","A2","F2","G2","C3"];
let mus = { on:false, timer:null, step:0, next:0, gain:null };
function startMusic(){
  if(muted || mus.on) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    mus.gain = AC.createGain(); mus.gain.gain.value = .55; mus.gain.connect(AC.destination);
    mus.on = true; mus.step = 0; mus.next = AC.currentTime + .08;
    mus.timer = setInterval(schedMusic, 25);
  }catch(e){}
}
function stopMusic(){
  mus.on = false; clearInterval(mus.timer);
  if(mus.gain){ try{ const g=mus.gain; g.gain.setTargetAtTime(0, AC.currentTime, .05); setTimeout(()=>g.disconnect(), 300); }catch(e){} mus.gain=null; }
}
function tone(type, f, t, dur, vol, out){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(vol, t); g.gain.setValueAtTime(vol, t+dur*.7); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(out); o.start(t); o.stop(t+dur+.02);
}
let noiseBuf = null;
function hat(t, out, vol){
  if(!noiseBuf){ noiseBuf = AC.createBuffer(1, AC.sampleRate*.05, AC.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  const n = AC.createBufferSource(), g = AC.createGain(), hp = AC.createBiquadFilter();
  n.buffer = noiseBuf; hp.type="highpass"; hp.frequency.value = 6000;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t+.04);
  n.connect(hp); hp.connect(g); g.connect(out); n.start(t); n.stop(t+.05);
}
function schedMusic(){
  if(!mus.on || !mus.gain) return;
  const bpm = 138 + Math.min(30, ((S&&S.lvl)||1)-1)*3, e = 60/bpm/2;   // corchea; se acelera un poco con el nivel
  while(mus.next < AC.currentTime + .15){
    const bar = Math.floor(mus.step/8) % MEL.length, k = mus.step % 8, t = mus.next, out = mus.gain;
    const n = MEL[bar][k];
    if(n!=="-" && n!=="."){ let len=1; while(k+len<8 && MEL[bar][k+len]==="-") len++; tone("square", NOTE(n), t, e*len*.95, .045, out); tone("square", NOTE(n)*1.005, t, e*len*.9, .015, out); }
    const root = NOTE(BASS[bar]); tone("triangle", k%2 ? root*2 : root, t, e*.9, .11, out);
    if(k%2===1) hat(t, out, .035);
    if(k===0 || k===4){ const kk = AC.createOscillator(), kg = AC.createGain(); kk.frequency.setValueAtTime(140,t); kk.frequency.exponentialRampToValueAtTime(45,t+.1); kg.gain.setValueAtTime(.14,t); kg.gain.exponentialRampToValueAtTime(.0001,t+.12); kk.connect(kg); kg.connect(out); kk.start(t); kk.stop(t+.13); }
    mus.step++; mus.next += e;
  }
}
// Ladrido triste y chistoso al perder: "guau" + aullido que baja + "uuh uuh"
function sadBark(dogK){
  if(muted) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const big = dogK==="lizy", base = big ? 1 : 1.7, t = AC.currentTime;
    bark(dogK);
    const o = AC.createOscillator(), g = AC.createGain(), bp = AC.createBiquadFilter(), lfo = AC.createOscillator(), lg = AC.createGain();
    o.type="sawtooth"; bp.type="bandpass"; bp.frequency.value = big?800:1300; bp.Q.value=2;
    o.frequency.setValueAtTime(520*base, t+.25); o.frequency.exponentialRampToValueAtTime(380*base, t+.5); o.frequency.exponentialRampToValueAtTime(170*base, t+1.15);
    lfo.frequency.value = 7; lg.gain.value = 14*base; lfo.connect(lg); lg.connect(o.frequency);
    g.gain.setValueAtTime(0.0001, t+.24); g.gain.exponentialRampToValueAtTime(.25, t+.32); g.gain.setValueAtTime(.22, t+.9); g.gain.exponentialRampToValueAtTime(0.0001, t+1.2);
    o.connect(bp); bp.connect(g); g.connect(AC.destination); o.start(t+.24); lfo.start(t+.24); o.stop(t+1.22); lfo.stop(t+1.22);
    [0,1].forEach(i=>{ const s0=t+1.3+i*.22, oo=AC.createOscillator(), gg=AC.createGain(); oo.type="triangle";
      oo.frequency.setValueAtTime((i?300:360)*base, s0); oo.frequency.exponentialRampToValueAtTime((i?220:280)*base, s0+.16);
      gg.gain.setValueAtTime(.0001,s0); gg.gain.exponentialRampToValueAtTime(.2,s0+.02); gg.gain.exponentialRampToValueAtTime(.0001,s0+.17);
      oo.connect(gg); gg.connect(AC.destination); oo.start(s0); oo.stop(s0+.18); });
  }catch(e){}
}
const sBone = ()=>{ beep(900, 1300, .08, "square", .05); setTimeout(()=>beep(1300,1700,.08,"square",.05),70); };
const sHit  = ()=>beep(300, 60, .45, "sawtooth", .09);
const sLvl  = ()=>{ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,f,.12,"triangle",.07),i*110)); };

// ---------- Dibujo de las perritas ----------
function ell(c, x, y, rx, ry, col, rot=0){ c.fillStyle=col; c.beginPath(); c.ellipse(x,y,rx,ry,rot,0,Math.PI*2); c.fill(); }
function rect(c, x, y, w, h, col){ c.fillStyle=col; c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
function poly(c, pts, col){ c.fillStyle=col; c.beginPath(); c.moveTo(pts[0],pts[1]); for(let i=2;i<pts.length;i+=2) c.lineTo(pts[i],pts[i+1]); c.closePath(); c.fill(); }

// ---------- Patas articuladas ----------
// Ángulos medidos desde la vertical; positivo = hacia adelante. Cada pata tiene muslo, canilla y pie.
function seg(c, x1, y1, x2, y2, w, col){ c.strokeStyle=col; c.lineWidth=w; c.lineCap="round"; c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke(); }
function leg(c, hx, hy, L1, L2, a, b, w1, w2, c1, c2, paw){
  const kx = hx + Math.sin(a)*L1, ky = hy + Math.cos(a)*L1;
  const px = kx + Math.sin(a+b)*L2, py = ky + Math.cos(a+b)*L2;
  seg(c, hx, hy, kx, ky, w1, c1); seg(c, kx, ky, px, py, w2, c2);
  ell(c, px + 0.6, py - 0.2, w2*0.62, w2*0.42, paw);
}
// Ciclo de galope: apoyo (la pata va de adelante hacia atrás, recta) y vuelo (se dobla y vuelve adelante)
function gait(p, front){
  p = ((p % 1) + 1) % 1;
  if(p < 0.55){ const u = p/0.55; return front ? [0.5 - 1.05*u, 0] : [0.55 - 1.0*u, -0.45 + 0.25*u]; }
  const u = (p-0.55)/0.45, s = Math.sin(Math.PI*u);
  return front ? [-0.55 + 1.05*u + 0.25*s, -1.5*s] : [-0.45 + 1.0*u, -0.2 - 1.2*s];
}
function legPose(st, t, phase, front){
  if(st==="run") return gait(t*3.4 + phase, front);
  if(st==="air") return front ? [0.95, -0.9] : [-0.9, 0.5];          // en el aire: patas estiradas
  if(st==="duck") return front ? [1.25, -2.3] : [0.9, -2.1];         // agachada: patas recogidas
  return front ? [0.05, 0] : [0.25, -0.35];
}

// Lizy: grande, lomo negro, mejillas cafés, franja blanca en la cara, pecho y patas blancas, cola enroscada con punta blanca
function drawLizy(c, x, y, t, st){
  const K="#1f1b22", B="#8b5a33", Bl="#a8723f", Wt="#f3ede1", N="#0d0b0e";
  const run = st==="run", duck = st==="duck";
  const cyc = t*3.4, bounce = run ? Math.abs(Math.sin(cyc*Math.PI))*1.6 : 0;
  const drop = duck ? 7 : 0;
  c.save(); c.translate(x, y);
  const by = -14 + drop - bounce;                 // centro del cuerpo
  const hipB = [6, by+2], hipF = [21, by+2];
  const L1 = duck ? 5 : 6, L2 = duck ? 5 : 6;
  // patas del lado lejano (más oscuras)
  let [a,b] = legPose(st, t, .5, false); leg(c, hipB[0]+1.5, hipB[1], L1, L2, a, b, 3.4, 2.4, "#6d4527", "#cfc6b6", "#bdb3a2");
  [a,b] = legPose(st, t, .62, true);   leg(c, hipF[0]-1, hipF[1], L1, L2, a, b, 3.2, 2.4, "#cfc6b6", "#cfc6b6", "#bdb3a2");
  // cola: enroscada; agachada queda más baja
  c.strokeStyle=K; c.lineWidth=3.2; c.lineCap="round"; c.beginPath();
  const tw = run ? Math.sin(cyc*Math.PI*2)*1.2 : 0;
  if(duck){ c.moveTo(4, by-1); c.quadraticCurveTo(-3, by-3, -2, by-8); } else { c.moveTo(4, by-1); c.quadraticCurveTo(-3+tw, by-5, 1+tw, by-11); }
  c.stroke(); ell(c, duck ? -1.8 : 2.2+tw, duck ? by-8.5 : by-11.5, 2.6, 2.4, Wt);
  // cuerpo (se estira un poco al correr)
  const stretch = run ? Math.sin(cyc*Math.PI*2)*.8 : 0;
  ell(c, 14, by, 11.5 + stretch, duck ? 5.5 : 6.5, K);
  ell(c, 14, by+3.5, 9, 3, B);
  ell(c, 5.5, by+1.5, 4, 4.5, Bl);
  ell(c, 22.5, by+2, 4.2, 5.5, Wt);
  // patas del lado cercano
  [a,b] = legPose(st, t, 0, false); leg(c, hipB[0], hipB[1], L1, L2, a, b, 3.8, 2.6, B, Wt, "#fffaf0");
  [a,b] = legPose(st, t, .12, true); leg(c, hipF[0], hipF[1], L1, L2, a, b, 3.4, 2.6, Wt, Wt, "#fffaf0");
  // cabeza: agachada va más baja y estirada hacia adelante, orejas hacia atrás
  const hb = run ? Math.sin(cyc*Math.PI*2)*.6 : 0;
  const hx = duck ? 3 : 0, hy = (duck ? 9 : 0) + hb + (by + 14);
  c.translate(hx, hy);
  if(duck){
    poly(c, [22,-22.5, 18,-26, 24.5,-23.5], K);       // orejas echadas hacia atrás
    poly(c, [24,-23, 20.5,-27, 27,-23.5], K);
    poly(c, [23.5,-23.5, 21.5,-25.5, 25.5,-23.8], B);
  } else {

// Camila: chiquita, negra con café, hocico canoso, orejas caídas, patas color crema
function drawCamila(c, x, y, t, st){
  const K="#1d1a1c", B="#7d5232", Bt="#a77748", G="#b9b2a6", Wt="#e9e3d6", N="#0d0b0e", Pw="#d8b98c";
  const run = st==="run", duck = st==="duck";
  const tt = t*1.15, cyc = tt*3.4, bounce = run ? Math.abs(Math.sin(cyc*Math.PI))*1.1 : 0;   // patas cortas: pasos más rápidos
  const drop = duck ? 4 : 0;
  c.save(); c.translate(x, y);
  const by = -8.5 + drop - bounce;
  const hipB = [4, by+1.5], hipF = [13.5, by+1.5];
  const L1 = duck ? 3.4 : 3.8, L2 = duck ? 3.2 : 3.8;
  let [a,b] = legPose(st, tt, .5, false); leg(c, hipB[0]+1, hipB[1], L1, L2, a, b, 2.6, 2, "#5d3c24", "#b89c74", "#a88f6c");
  [a,b] = legPose(st, tt, .62, true);   leg(c, hipF[0]-1, hipF[1], L1, L2, a, b, 2.4, 2, "#5d3c24", "#b89c74", "#a88f6c");
  // cola peluda que se mueve
  const tw = run ? Math.sin(cyc*Math.PI*2)*1.4 : 0;
  c.strokeStyle=K; c.lineWidth=2.6; c.lineCap="round"; c.beginPath(); c.moveTo(2.5, by-.5); c.quadraticCurveTo(-2, by-.5, -3, by+3.5+tw); c.stroke();
  ell(c, -2.6, by+3.5+tw, 1.6, 1.8, B);
  // cuerpo
  ell(c, 9, by, 8.5, duck ? 4.2 : 5, K);
  ell(c, 9, by+2.5, 6.5, 2.4, B);
  ell(c, 4, by-1, 3.4, 3, Bt);
  ell(c, 12, by-2.5, 3.5, 2, B);
  [a,b] = legPose(st, tt, 0, false);  leg(c, hipB[0], hipB[1], L1, L2, a, b, 2.8, 2.2, B, Pw, "#efdcb8");
  [a,b] = legPose(st, tt, .12, true); leg(c, hipF[0], hipF[1], L1, L2, a, b, 2.6, 2.2, B, Pw, "#efdcb8");
  // cabeza
  const hb = run ? Math.sin(cyc*Math.PI*2)*.5 : 0;
  c.translate(duck ? 2 : 0, (duck ? 5 : 0) + hb + (by + 8.5));
  ell(c, 16.5, -12.5, 4.8, 4.4, K);
  ell(c, 20.4, -10.8, 3.3, 2.3, G);
  ell(c, 21.5, -10, 2, 1.3, Wt);
  ell(c, 23.4, -11.4, 1.3, 1.1, N);
  const flap = run ? Math.sin(cyc*Math.PI*2)*.25 : 0;
  ell(c, 13.6, -11.3, 1.9, 3.6, K, .25 + flap + (duck ? .6 : 0));
  rect(c, 17.6, -14.6, 1.4, 1.4, "#2a1a10");
  rect(c, 17.9, -14.6, .6, .6, "#e8d0b0");
  rect(c, 17.2, -16.2, 2.4, .9, G);
  c.restore();
}

let S = null, dogKey = "camila", state = "menu", last = 0, T = 0;
function newGame(){
  const d = DOGS[dogKey];
  S = { dog:d, x:36, y:GROUND, vy:0, jumps:0, duck:false, obs:[], bones:[], parts:[], off:0, speed:120, dist:0, nb:0, nm:0, lvl:1, next:220, nextBone:160, msg:"", msgT:0, flash:0 };
}
const score = ()=> Math.floor(S.dist) + S.nb*10 + S.nm*20;

function jump(){
  if(state!=="play") return;
  const d = S.dog;
  if(S.y >= GROUND-0.5){ S.vy = -d.jump; S.jumps = 1; bark(dogKey); }
  else if(S.jumps < 2){ S.vy = -d.jump*.82; S.jumps = 2; bark(dogKey, true); for(let k=0;k<6;k++) S.parts.push({x:S.x+d.w/2,y:S.y-2,vx:(Math.random()-.5)*60,vy:Math.random()*30,l:.4,c:"#fff6d6"}); }
}
function setDuck(v){ if(state!=="play") return; S.duck = v; if(v && S.y < GROUND-1) S.vy = Math.max(S.vy, 260); }

function spawn(){
  const lv = S.lvl, r = Math.random();
  let type = "limonero";
  if(lv>=2 && r<.22) type="cuculi";
  else if(r<.5) type="limonero";
  else if(r<.78) type = lv>=2 ? "limonero2" : "limonero";
  else type="mango";
  const t = TYPES[type];
  const o = { type, x:W+10, w:t.w, h:t.h, y:GROUND };
  if(t.fly){ o.y = GROUND - 19 - Math.random()*4; }
  S.obs.push(o);
  // a veces dos limoneros juntos en niveles altos
  if(lv>=4 && type==="limonero" && Math.random()<.4) S.obs.push({type:"limonero", x:W+28, w:15, h:15, y:GROUND});
  const minGap = S.speed*0.85 + 40;
  S.next = minGap + Math.random()*S.speed*0.9;
}
function spawnBones(){
  const n = 3 + Math.floor(Math.random()*3), high = Math.random()<.5;
  const pan = Math.random()<.35;
  for(let k=0;k<n;k++){ const arc = high ? Math.sin(k/(n-1)*Math.PI)*22 : 0; S.bones.push({x:W+10+k*16, y:GROUND-22-arc-(high?10:0), pan: pan || (n>=4 && k===Math.floor(n/2) && Math.random()<.5)}); }
  S.nextBone = 260 + Math.random()*260;
}
function hitbox(){
  const d = S.dog, h = S.duck && S.y>=GROUND-0.5 ? d.dh : d.h;
  return {x:S.x+3, y:S.y-h, w:d.w-4, h:h-1};
}
const overlap = (a,b)=> a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;

function update(dt){
  const d = S.dog;
  // nivel cada 300 m
  const lvl = 1 + Math.floor(S.dist/300);
  if(lvl > S.lvl){ S.lvl = lvl; S.msg = "¡Nivel " + lvl + "!"; S.msgT = 1.6; sLvl(); }
  S.speed = Math.min(270, 120 + (S.lvl-1)*18 + (S.dist%300)*0.02);
  const mv = S.speed*dt;
  S.off += mv; S.dist += mv/10;
  // física
  S.vy += G*dt*(S.vy>0?1.25:1); S.y += S.vy*dt;
  if(S.y >= GROUND){ S.y = GROUND; S.vy = 0; S.jumps = 0; }
  // generar
  S.next -= mv; if(S.next<=0) spawn();
  S.nextBone -= mv; if(S.nextBone<=0) spawnBones();
  // mover
  S.obs.forEach(o=>{ o.x -= mv * (o.type==="cuculi"?1.25:1); });
  S.obs = S.obs.filter(o=>o.x > -40);
  S.bones.forEach(b=> b.x -= mv);
  const hb = hitbox();
  S.bones = S.bones.filter(b=>{
    if(b.x < -20) return false;
    if(overlap(hb, {x:b.x, y:b.y, w:13, h:7})){ if(b.pan) S.nm++; else S.nb++; sBone(); for(let k=0;k<5;k++) S.parts.push({x:b.x+6,y:b.y+3,vx:(Math.random()-.5)*80,vy:-Math.random()*80,l:.5,c:b.pan?"#f1cf8e":"#ffe08a"}); return false; }
    return true;
  });
  for(const o of S.obs){
    const ob = {x:o.x+2, y:o.y-o.h+1, w:o.w-4, h:o.h-1};
    if(overlap(hb, ob)){ return gameOver(); }
  }
  // polvo al correr
  if(S.y>=GROUND && Math.random()<dt*14) S.parts.push({x:S.x+2,y:GROUND-1,vx:-30-Math.random()*20,vy:-Math.random()*25,l:.35,c:"#e2d2b0"});
  S.parts.forEach(p=>{ p.x+=p.vx*dt - mv*.3; p.y+=p.vy*dt; p.vy+=200*dt; p.l-=dt; });
  S.parts = S.parts.filter(p=>p.l>0);
  if(S.msgT>0) S.msgT -= dt;
}

function render(){
  const c = lc;
  drawBg(c, S ? S.off : T*40, S ? S.lvl : 1);
  if(!S) return;
  S.bones.forEach(b=> (b.pan ? marraqueta : bone)(c, b.x, b.y + Math.sin(T*6+b.x*.1)*1));
  S.obs.forEach(o=> TYPES[o.type].draw(c, o, T));
  S.parts.forEach(p=> rect(c, p.x, p.y, 1.5, 1.5, p.c));
  // sombra
  const sh = Math.max(.25, 1 - (GROUND-S.y)/80);
  ell(c, S.x + S.dog.w/2, GROUND+1, S.dog.w/2*sh, 1.6*sh, "rgba(0,0,0,.18)");
  const st = state==="over" ? "air" : (S.y < GROUND-0.5 ? "air" : (S.duck ? "duck" : "run"));
  S.dog.draw(c, S.x, S.y, T, st);
  // HUD
  c.font = "bold 10px Verdana, Arial, sans-serif"; c.textBaseline = "top";
  const txt = (s, x, y, al="left", col="#fff")=>{ c.textAlign = al; c.fillStyle="#000"; c.fillText(s, x+1, y+1); c.fillStyle=col; c.fillText(s, x, y); };
  txt(Math.floor(S.dist)+" m", 6, 5);
  bone(c, 6, 18); txt("x "+S.nb, 20, 17); marraqueta(c, 48, 17); txt("x "+S.nm, 63, 17);
  txt("Nivel "+S.lvl, W/2, 5, "center", "#ffe08a");
  const rec = records[dogKey]||0; if(rec) txt("Récord "+rec, W-56, 5, "right");
  if(S.msgT>0){ c.font="bold 17px Verdana, Arial, sans-serif"; txt(S.msg, W/2, 34, "center", "#ffe08a"); }
}

function frame(ts){
  const dt = Math.min(.033, (ts - last)/1000 || 0); last = ts; T += dt;
  if(state==="play") update(dt);
  else if(state==="menu" && S){ S.off += 40*dt; }
  render();
  ctx.drawImage(low, 0, 0);
  requestAnimationFrame(frame);
}

// ---------- Pantallas ----------
const $ = id=>document.getElementById(id);
function show(id){ ["menu","over","pause"].forEach(k=> $(k).hidden = k!==id); const playing = id===null; $("bJump").hidden = $("bDuck").hidden = !playing || !("ontouchstart" in window); $("bPause").hidden = !playing; }
function start(k){ dogKey = k; newGame(); state = "play"; show(null); try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); AC.resume(); }catch(e){}
  bark(k); setTimeout(()=>bark(k), 230); stopMusic(); setTimeout(startMusic, 550); }
function gameOver(){
  state = "over"; stopMusic(); sadBark(dogKey);
  const sc = score(), prev = records[dogKey]||0, nuevo = sc > prev;
  if(nuevo){ records[dogKey] = sc; saveRec(); }
  $("ovTitle").textContent = nuevo ? "¡Nuevo récord de " + S.dog.name + "!" : "¡Ay, " + S.dog.name + "!";
  $("ovScore").textContent = sc + " puntos";
  $("ovInfo").textContent = Math.floor(S.dist) + " metros, " + S.nb + " huesos (10 puntos c/u), " + S.nm + " marraquetas (20 puntos c/u), nivel " + S.lvl + "." + (nuevo ? "" : " Récord: " + prev + ".");
  setTimeout(()=>show("over"), 450);
}
function menu(){ stopMusic(); state = "menu"; S = null; recText(); show("menu"); }
function recText(){ const a = records.camila||0, b = records.lizy||0; $("recTxt").textContent = (a||b) ? `Récords: Camila ${a} · Lizy ${b}` : ""; }

document.querySelectorAll(".dog").forEach(b=> b.addEventListener("click", ()=> start(b.dataset.dog)));
$("again").onclick = ()=> start(dogKey);
$("change").onclick = menu;
$("bPause").onclick = ()=>{ if(state==="play"){ state="pause"; show("pause"); stopMusic(); } };
$("resume").onclick = ()=>{ state="play"; show(null); startMusic(); };
$("quit").onclick = menu;
$("bMute").onclick = ()=>{ muted = !muted; if(muted) stopMusic(); else if(state==="play") startMusic(); $("bMute").style.opacity = muted ? .45 : 1; try{ localStorage.setItem("cl-mute", muted?"1":"0"); }catch(e){} };
$("bMute").style.opacity = muted ? .45 : 1;

// Controles: teclado, botones y tocar la pantalla
addEventListener("keydown", e=>{
  if(["Space","ArrowUp","KeyW"].includes(e.code)){ e.preventDefault(); if(state==="play") jump(); else if(state==="over") start(dogKey); }
  if(["ArrowDown","KeyS"].includes(e.code)){ e.preventDefault(); setDuck(true); }
  if(e.code==="KeyP"||e.code==="Escape"){ if(state==="play"){ state="pause"; show("pause"); stopMusic(); } else if(state==="pause"){ state="play"; show(null); startMusic(); } }
});
addEventListener("keyup", e=>{ if(["ArrowDown","KeyS"].includes(e.code)) setDuck(false); });
const press = (el, on, off)=>{ el.addEventListener("pointerdown", e=>{ e.preventDefault(); on(); }); if(off){ ["pointerup","pointercancel","pointerleave"].forEach(ev=> el.addEventListener(ev, off)); } };
press($("bJump"), jump);
press($("bDuck"), ()=>setDuck(true), ()=>setDuck(false));
// tocar la pantalla: mitad derecha salta, mitad izquierda se agacha (mientras se mantiene)
let touchDuck = false;
cv.addEventListener("pointerdown", e=>{ if(state!=="play") return; e.preventDefault(); if(e.clientX < innerWidth*0.35 && e.pointerType!=="mouse"){ touchDuck = true; setDuck(true); } else jump(); });
addEventListener("pointerup", ()=>{ if(touchDuck){ touchDuck=false; setDuck(false); } });
document.addEventListener("visibilitychange", ()=>{ if(document.hidden && state==="play"){ state="pause"; show("pause"); stopMusic(); } });

// Miniaturas del menú
function thumb(id, fn){ const c = $(id).getContext("2d"); let t = 0; (function loop(){ t += .016; c.clearRect(0,0,64,40); rect(c,0,32,64,8,"#cbb994"); fn(c, fn===drawLizy?14:22, 32, t, "run"); requestAnimationFrame(loop); })(); }
thumb("thC", drawCamila); thumb("thL", drawLizy);

if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
recText(); show("menu");
requestAnimationFrame(frame);
</script>
